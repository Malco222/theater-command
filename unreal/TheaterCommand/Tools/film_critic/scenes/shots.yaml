# Film critic shots: for each scene of scenes.txt, its theater (the Look Bible's T1..T9), when, the nations, and
# every picture it should make, with the tags that choose which rules (rules.yaml) judge it and one line on what
# it should show. `file` is a file name or a glob. Step runs: step-NNN.png is the picture of step NNN of the
# scene's step file (the step files' comments say the same, by number). Film strips (strip-*.jpg) take the tags of
# the still they follow; the strip entries here only say which steps are filmed. `look: true` asks the judge for
# the Look Bible score of that picture.
# Tags: the agreed list, plus ONE NEW TAG, map-night (the campaign map held at night by the T key), for the
# "own ground by night must not read as fog" rule (Brian: "America looks fogged").
# Written from one table with the step files (the scene writer's generator), so numbers and tags agree.
scenes:
  air-raid-rhineland:
    kind: air
    theater: T1
    year: 1940
    month: 1
    nations: [FRA, GER]
    about: "A French day raid on the Rhineland flown live, January 1940"
    pictures:
      - {file: "step-001.png", tags: [map], about: "the French campaign table, January 1940, as it opens"}
      - {file: "step-002.png", tags: [ui], about: "the raid card DAY BOMBING: RHINELAND, with FLY THE RAID BY DAY and FLY IT YOURSELF"}
      - {file: "step-003.png", tags: [air-flyover], about: "the air battle opens: a second in (it may still be the black frame while the scene warms up)"}
      - {file: "strip-003-*.jpg", tags: [strip, air-flyover], about: "film strip of step 003 (the air battle opens)"}
      - {file: "step-004.png", tags: [air-flyover], about: "one real second after the opening's black frame lifts: the raid's opening shot", look: true}
      - {file: "strip-004-*.jpg", tags: [strip, air-flyover], about: "film strip of step 004 (one real second after the opening's black frame lifts)"}
      - {file: "step-005.png", tags: [air-flyover], about: "three seconds on: the bombers' formation in the opening flyover"}
      - {file: "strip-005-*.jpg", tags: [strip, air-flyover], about: "film strip of step 005 (three seconds on)"}
      - {file: "step-006.png", tags: [air-flyover], about: "four seconds on: the flyover over the target, the defending fighters coming up (the guard)", look: true}
      - {file: "strip-006-*.jpg", tags: [strip, air-flyover], about: "film strip of step 006 (four seconds on)"}
      - {file: "step-007.png", tags: [air-battle], about: "the flyover over: command taken, the strategy view of both formations"}
      - {file: "strip-007-*.jpg", tags: [strip, air-flyover], about: "film strip of step 007 (the flyover over)"}
      - {file: "step-008.png", tags: [air-battle], about: "pace x0.5 (the clock still runs x10 by itself until the formations meet)"}
      - {file: "step-009.png", tags: [air-battle], about: "silent wait (about 66 s, no strip): the formations meet at about 181; still at about battle s 193, the first passes", look: true}
      - {file: "step-010.png", tags: [air-battle], about: "pace x1"}
      - {file: "step-011.png", tags: [air-battle], about: "24 real s of the fight at x1 (battle s 193 to 205): fighters among the bombers, tracer"}
      - {file: "strip-011-*.jpg", tags: [strip, air-battle], about: "film strip of step 011 (24 real s of the fight at x1 (battle s 193 to 205))"}
      - {file: "step-012.png", tags: [air-chase], about: "C: the chase view, the eye glides behind his squadron's leader", look: true}
      - {file: "step-013.png", tags: [air-chase], about: "8 real s of the chase view"}
      - {file: "strip-013-*.jpg", tags: [strip, air-chase], about: "film strip of step 013 (8 real s of the chase view)"}
      - {file: "step-014.png", tags: [air-chase], about: "the next aircraft of his in the chase view"}
      - {file: "step-015.png", tags: [air-chase], about: "4 real s behind that aircraft"}
      - {file: "strip-015-*.jpg", tags: [strip, air-chase], about: "film strip of step 015 (4 real s behind that aircraft)"}
      - {file: "step-016.png", tags: [air-battle], about: "Esc: back to the strategy view"}
      - {file: "step-017.png", tags: [air-battle], about: "pace x4"}
      - {file: "step-018.png", tags: [air-battle], about: "silent wait at x4: still at about battle s 343, the bombers well on toward the target"}
      - {file: "step-019.png", tags: [air-battle], about: "pace x1"}
      - {file: "step-020.png", tags: [air-battle], about: "silent wait at x1: still at about battle s 376, the bombers close to the target"}
      - {file: "step-021.png", tags: [air-battle], about: "pace x4"}
      - {file: "step-022.png", tags: [air-bombs, air-battle], about: "battle s 386: the run-in to the target"}
      - {file: "strip-022-*.jpg", tags: [strip, air-bombs], about: "film strip of step 022 (battle s 386)"}
      - {file: "step-023.png", tags: [air-bombs], about: "pace x1 for the bombs (the strike itself never runs fast)"}
      - {file: "step-024.png", tags: [air-bombs], about: "battle s 386 to 401 at x1 (30 real s, strip the first 24): the bombs fall at about 393; still just after", look: true}
      - {file: "strip-024-*.jpg", tags: [strip, air-bombs], about: "film strip of step 024 (battle s 386 to 401 at x1 (30 real s, strip the first 24))"}
      - {file: "step-025.png", tags: [air-battle], about: "pace x4; the fight winds down at x10 by itself"}
      - {file: "step-026.png", tags: [air-after-card, air-battle], about: "silent wait: the raid over at about battle s 453; still: the after card, or the last of the fight"}
      - {file: "step-027.png", tags: [air-after-card, ui], about: "the after card: the raid's result, losses on both sides", look: true}
      - {file: "step-028.png", tags: [map], about: "CONTINUE: the battle handed back to the map (the step waits for the table)"}
      - {file: "step-029.png", tags: [air-after-card, map], about: "spare: had 028 answered a question in place of the card, the card is waited for here (else nothing is up)"}
      - {file: "step-030.png", tags: [map], about: "spare CONTINUE (else: no air battle is up)"}
      - {file: "step-031.png", tags: [map], about: "the French map after the raid"}
