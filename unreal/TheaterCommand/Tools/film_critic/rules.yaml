# Film critic rules: what must always be true on screen. (Started as a stub of 4 rules to fix the format; the full list follows.)
#
# Each rule:
#   id:       short-kebab name, never reused
#   title:    a few plain words, as the morning report heads it
#   words:    the rule in plain words, general enough to catch the same KIND of mistake anywhere
#   from:     who found the bug it comes from (Brian first), when (YYYY-MM-DD), and what they said or saw
#             (said: his words when quoted; "seen: ..." when it is what was seen); also: the other finds merged in
#   tags:     the shot tags it applies to (scenes/shots.yaml gives each picture its tags); every-picture = all
#   picture:  (optional) a question a vision judge answers from a still: PASS, FAIL or CAN'T TELL, saying where
#   clip:     (optional) measures on film strips: list of {measure: jump|pop|freeze|flicker|blank|stutter|zoom, max: N}
#             (max = most allowed in one strip; per_minute: true makes it a rate)
#   facts:    (optional) the name of a check in check_facts.py run over critic-facts.jsonl
#   later:    (only when none of picture, clip or facts can check it yet) what would be needed to measure it
#   owner:    who fixes it (a key of owners below)
#   weight:   high (Brian found it, or it breaks the film) or normal
#   known:    open, fixed, "off" (quoted; a fix is built but switched off) or unknown, when the rule was written
#             (a fixed bug that comes back is a regression); known_note: a short why

owners:
  navy:        {who: "the ships and sea thread", covers: "ships, fleets on the map, wakes, sea battles"}
  air:         {who: "the 3D air thread", covers: "raids, air battles, pilots, aircraft, the air camera"}
  ground:      {who: "the tank and land battle thread", covers: "tanks and vehicles, how units move and fight in land battles, battle size, deploy and ending"}
  soldiers:    {who: "the soldiers thread", covers: "men in land battles: bodies, faces, uniforms, poses, gaits, falls, gun teams, snipers"}
  ai:          {who: "the battle AI thread", covers: "how men and vehicles pick targets, routes and moments to act"}
  models:      {who: "the model makers (warplanes and modeller threads)", covers: "aircraft, ship and tank models: shape, glass, detail, crew figures in them"}
  camera:      {who: "the camera thread", covers: "battle cameras, cuts, framing"}
  environment: {who: "the environments thread", covers: "ground, grass, trees, sky, weather, buildings and ruins in every theater"}
  effects:     {who: "the effects thread", covers: "smoke, fire, explosions, splashes, tracer"}
  map:         {who: "the campaign map look thread", covers: "the map's land, sea, cities, pieces"}
  ui:          {who: "the UI director", covers: "words, cards, buttons on screen"}
  speed:       {who: "the speed detective", covers: "frame rate, hitches, freezes"}
  marks:       {who: "the markings and paint work", covers: "national markings and paint on every unit"}

rules:

  # ---------------------------------------------------------------- the camera and the whole picture

  - id: camera-smooth
    title: The camera moves smoothly
    words: >
      A camera never jumps, stutters, zooms in a jerk or flickers: between two frames that are not a cut the view
      moves by about the same step as the frames around it (no lurch beyond about 20 px on a 1920-wide picture), the
      lens or the distance to the subject never changes by more than about 10% in one frame, a move starts and ends
      gently, and nothing blinks. This holds for every camera: battle overviews, chase views, the bombing film, land
      cuts and the map.
    from:
      who: Brian
      when: "2026-11-26 04:11Z"
      said: "the bombing video camera is super choppy ... its flickers and itsn't smooth"
      also:
        - {who: Brian, when: "2026-11-25 14:59Z", said: "this air battle scene looks horrible. the video is jumping around (the overview camera jumped over 20 px about 100 times a minute)"}
        - {who: Brian, when: "2026-11-25 21:11Z", said: "seen: what he called flickering was the overview zooming from 832 m to about 450 m and back in a few frames, 14-20 times a battle"}
        - {who: camera director, when: "2026-11-25", said: "seen: land camera jolts and hitches between cuts (angular acceleration over 1200 degrees a second squared)"}
        - {who: 3D air thread, when: "2026-11-26 02:40Z", said: "seen: the glide from the flyover into the overview jolts (3 frames of 120, 67 and 34 px) every battle"}
    # strip: the clip part on every strip; the scene tags let check_night run the camera-smooth facts check
    tags: [strip, map, map-raid, map-fleet-sailing, air-flyover, air-battle, air-chase, air-bombs, land-opening, land-advance, sea-battle, sea-close]
    clip:
      - {measure: jump, max: 0}
      - {measure: stutter, max: 0}
      - {measure: zoom, max: 0}
      - {measure: flicker, max: 0}
    facts: camera-smooth
    owner: camera
    weight: high
    known: open
    known_note: "air overview fix camera built (0 jumps a minute) but not on the Play icon; zoom drifts, the glide jolt, the bombing film and land cuts open"

  - id: no-held-frames
    title: No frozen or held frames
    words: >
      While a picture is on screen and moving, no frame is held: no frame takes over 100 ms (never over 250 ms), and
      nothing stalls when a new aircraft type, effect or part of the scene first appears, while the map runs a raid,
      or when the game comes back to the map from a battle. Heavy work is done under the opening black.
    from:
      who: Brian
      when: "2026-11-24 16:33Z"
      said: "seen: freezes at the start of raids (0.65-0.9 s stalls three times a raid); he asked for them to be patched"
      also:
        - {who: Brian, when: "2026-11-23", said: "seen: stutters of 200 to 550 ms in live land battles"}
        - {who: 3D air thread, when: "2026-11-26 02:40Z", said: "seen: a 219 ms freeze and a 66 px lurch when the Swedes first appear, because their stand-in shape is built mid-battle"}
        - {who: release lead, when: "2026-11-24", said: "seen: the map's smoke update costs 23-38 ms a frame during raids; coming back from a battle stalls about 330 ms"}
    tags: [strip]
    clip:
      - {measure: freeze, max: 0}
    owner: speed
    weight: high
    known: open
    known_note: "raid-opening stalls fixed in 1.5.1 (one 314 ms left); the stand-in shape hitch and map raid hitches open"

  - id: frame-rate-holds
    title: Battles keep 45 frames a second
    words: >
      A battle, and the map during a raid, runs at 45 frames a second or more on the Mac all the way through (checked
      at 20, 40 and 60 s) in every theater; a heavy look (jungle, a crowd of men) never drags it down.
    from:
      who: Brian
      when: "2026-11-23"
      said: "seen: stutters and slow frames in live land battles"
      also:
        - {who: art director, when: "2026-11-25 14:01Z", said: "seen: Normandy 55, 45, 44 frames a second (worst 41); jungle 33 to 50"}
    tags: [land-opening, land-advance, land-close-men, land-vehicles, land-village, air-battle, sea-battle, map-raid]
    later: "a check that fails a scene under 45 frames a second (check_night already reads the frame rate from steps.jsonl and the log's Speed lines; no rule reads that number yet)"
    owner: speed
    weight: high
    known: open
    known_note: "open on Normandy and jungle"

  - id: picture-readable
    title: Every picture can be seen
    words: >
      Every picture is readable: under 30% of it near black, and never a blank or flat frame of haze, white or one
      colour where ground or a subject should be. The scene is in place and lit before the first picture shows.
    from:
      who: art director
      when: "2026-11-25 14:01Z"
      said: "seen: Normandy shot 0 was black (mean L 22, 86% under 40): the camera started inside a hedge"
      also:
        - {who: air scene thread, when: "2026-11-24 03:59Z", said: "seen: the flyover opened on plain haze because the ground was laid 9.3-9.8 s after the press and the flyover lasts 9.5 s"}
    tags: [every-picture]
    picture: >
      Is this picture readable? FAIL if more than about a third of it is near black (so dark that nothing can be made
      out there), or if it is almost all one flat colour (plain haze, white, grey or black) with no ground, horizon or
      subject to be seen. A night picture that is dark but still shows shapes, lights or fire is a PASS.
    clip:
      - {measure: blank, max: 0}
    owner: camera
    weight: high
    known: open
    known_note: "the camera's dark reading is blind and switched off; the early ground for the flyover was reverted in 1.5"

  - id: lens-clear
    title: Nothing blocks the lens
    words: >
      The lens is always clear: no leaf, branch, smoke, burst, fireball, effect card, aerial, wire or part of the
      camera's own tank, ship or aircraft sits close in front of it or crosses the frame in front of the subject,
      unless the shot is meant to be from inside.
    from:
      who: Brian
      when: "2026-11-25 16:35Z"
      said: "seen (his screenshot): a thin dark line from the bottom to the top of the picture over a Sherman: the tank's aerial right in front of the lens"
      also:
        - {who: art director, when: "2026-11-20 14:43Z", said: "seen: Pearl Harbor shot 06's camera sat inside the smoke; muzzle-flash and burst cards within 4 m of the lens black the picture"}
        - {who: camera director, when: "2026-11-23", said: "seen: hedge leaves over the lens in the bocage; the camera placed inside bursts and fuel balls at tank kills"}
    tags: [every-picture]
    picture: >
      Is anything very close to the lens hiding part of the view: a big blurred leaf or branch, a soft blob of smoke or
      fire filling a corner or more, a thin dark line (an aerial or a wire) running across most of the picture's height
      or width, or a blurred piece of the camera's own vehicle or aircraft? FAIL naming it and where. Real things at a
      normal distance (a tree behind a tank, smoke on the far side of the field) are a PASS.
    owner: camera
    weight: high
    known: open
    known_note: "the aerial was mended on the camera branch only (5d40c8f8); Pearl 06 fixed; hedge and burst cases open in part"

  - id: subject-readable
    title: Each shot shows its subject
    words: >
      Every named shot shows what its name says, big enough to read: the main aircraft about 45-70 px across on a
      1920-wide picture and near the middle, a ship about a third of the width in a ship shot, the men or vehicles a
      land shot is about in clear view; never specks in a void, and never empty sky, sea or hills where the subject
      should be.
    from:
      who: art director
      when: "2026-11-19"
      said: "seen: planes 10-15 px specks in a white void; a carrier a small soft shape; 'the ships' picture framed hills with no ship"
      also:
        - {who: art director, when: "2026-11-24 03:04Z", said: "seen: the parachutes still showed empty sky (Bremen, as at Pearl Harbor)"}
    tags: [air-battle, air-chase, air-bombs, sea-battle, sea-close, land-advance, land-close-men, land-vehicles, land-village, land-fall]
    picture: >
      The shot is meant to show what its description says. Does it, and is that subject big enough to read (an
      aircraft at least about 2% of the picture's width, a ship about a third of the width in a ship shot, men or
      vehicles clearly made out)? FAIL if the subject is missing (empty sky, sea or hills) or is only a speck. CAN'T
      TELL if the picture has no description.
    owner: camera
    weight: normal
    known: open
    known_note: "air framing fixed by the framing laws; the Bremen parachutes still showed empty sky, carried to R2"

  - id: camera-holds-subject
    title: The camera holds its subject
    words: >
      A battle camera stays on one subject for at least about 8 s; to show something far away (over about 2 km) it
      cuts instead of sweeping across the sky, and it never wanders from clump to clump every few seconds.
    from:
      who: 3D air thread
      when: "2026-11-26 02:40Z"
      said: "seen: with the fix camera the overview sweeps to another clump every 10-15 s: 22 fast pans a battle, median 2.8 km in 2 s"
    tags: [air-battle]
    later: "the cam lines' subject per frame and a check of how long each subject is held and how far the look travels a second (camera-smooth reads jumps, not holds)"
    owner: air
    weight: normal
    known: open

  - id: labels-move-with-subject
    title: Labels stay with their units
    words: >
      A name tag or label on screen moves only with the thing it labels; it never hops on its own from one frame to
      the next.
    from:
      who: 3D air thread
      when: "2026-11-26 02:40Z"
      said: "seen: formation name tags hop (6 hops of over 20 px a battle)"
    tags: [air-battle]
    later: "label screen boxes per frame in the facts file, or a strip measure that follows a label against its subject"
    owner: air
    weight: normal
    known: open

  - id: signs-never-cover
    title: Labels never hide the action
    words: >
      On-screen tags, plates, boxes and route lines never cover the unit, flag, smoke or burst they are about: they sit
      beside it, give way to the action, stay thin at close zoom, and never sit on roofs.
    from:
      who: art director
      when: "2026-11-22"
      said: "seen: unit tags drawn over smoke and over the action they label (land battle, general view)"
      also:
        - {who: art director, when: "2026-11-16", said: "seen (map): a gate's pointing box covered the flag on its plate; the raid's dashed route was 30 px cream slabs close up; a lamp sat on roofs; town plates cover flags in the Low Countries"}
    tags: [land-opening, land-advance, map, map-army, map-city, map-raid]
    picture: >
      Does any on-screen label, name plate, box or drawn line cover a unit, its flag, smoke or a burst, so that the
      thing it is about is partly hidden? Also FAIL if a route line is a thick slab instead of a thin line, or a sign
      sits on top of houses. Say which label and what it hides.
    owner: ui
    weight: normal
    known: open
    known_note: "map route and lamp fixed (rounds 38-39); plates over flags and land tags over smoke open"

  - id: film-catches-big-moments
    title: The film shows the big moments
    words: >
      The battle film is on the big moments: every tank kill, barrage, bail-out and fall the battle books is seen on
      screen, not left off camera.
    from:
      who: camera director
      when: "2026-11-23 18:05Z"
      said: "seen: the film missed tank kills (0 of 3 in Normandy before the fix); a radio barrage in the bocage finds no open place and is missed"
    tags: [land-advance, land-vehicles, land-fall]
    later: "director event lines (kill, barrage, bail-out) in the facts file, checked against the shot on screen at that moment"
    owner: camera
    weight: normal
    known: open
    known_note: "kills fixed (2341cbfe, 3 of 3); the barrage in the bocage open"

  - id: pace-changes-eased
    title: Speed-ups and slow-downs are eased
    words: >
      When the battle clock changes pace (fast forward to normal at first contact, and back at the wind-down) the
      change is eased over at least about 1 s; the picture never brakes or races in one frame, and no aircraft leaves
      its path when it does.
    from:
      who: 3D air thread
      when: "2026-11-26 02:40Z"
      said: "seen: the battle clock drops from x10 to x1 in one frame at first contact: everything brakes and every aircraft leaves its path once (median 7.8 m, up to 44 m)"
    tags: [air-battle]
    later: "the clock's pace per frame in the facts file (a change of at most 2x a frame); the picture jump it makes is already counted by camera-smooth"
    owner: air
    weight: normal
    known: "off"
    known_note: "fix part A built, row airSteady OFF"

  - id: big-moments-at-normal-speed
    title: Decisive moments play at normal speed
    words: >
      Bomb release, torpedo drop, hits and falls are always shown at normal speed (x1), never inside a fast-forward.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: at Pearl Harbor and Midway the picture went to x20 two seconds after the torpedoes dropped; every bomb at Pearl and six of seven at Midway burst inside the fast-forward"
    tags: [air-bombs, air-battle]
    later: "the clock's pace at every bomb, torpedo, hit and fall in the facts file (fail when over 1)"
    owner: air
    weight: normal
    known: unknown
    known_note: "the build list says the strike is on; not confirmed"

  # ---------------------------------------------------------------- air battles and raids

  - id: raid-opening-shows-interceptors
    title: The raid's opening shows the fighters
    words: >
      Every opening or establishing shot shows what it is about for most of its length: a raid's opening shows the
      bombers and the fighters coming up to meet them, not empty ground and cloud. A shot whose subject is not there
      yet is skipped or replaced, never shown empty.
    from:
      who: Brian
      when: "2026-11-26 03:57Z"
      said: "also in the begining of a raid it shows the ground and then clouds, I'm assuming its trying to show the interceptor planes coming but it never shows any planes"
    tags: [air-flyover]
    picture: >
      Is at least one aircraft clearly visible in this picture (more than a speck: about 1% of the picture's width or
      more)? If the shot's description names the fighters, the guard or the interceptors, are fighters (aircraft
      smaller than the bombers) visible? FAIL if the picture is only ground, sea or cloud, or if the named fighters are
      not there.
    facts: opening-shows-both-sides
    owner: air
    weight: high
    known: open
    known_note: "the air thread is measuring it in his Epirus battle and Bremen (26 Nov 04:08Z)"

  - id: aircraft-fly-smoothly
    title: Aircraft fly without shaking
    words: >
      An aircraft's attitude changes smoothly: no trembling, rocking or wing kick from one frame to the next, its roll
      and turn within what its type can do; a plane the camera follows holds steady on screen.
    from:
      who: Brian
      when: "2026-11-24 22:30Z"
      said: "seen: the planes shaking in the test video (fighters)"
      also:
        - {who: Brian, when: "2026-11-25 13:27Z", said: "the bomber is shaking in the video too like the fighter"}
    tags: [air-chase, air-battle]
    clip:
      - {measure: stutter, max: 0}
    owner: air
    weight: high
    known: open
    known_note: "fighters fixed in 1.5.1 (trembling 74 of 143 to 0); boxed bombers open (R2). A shake on a strip also counts against camera-smooth: the fault's place (a part of the picture, not the whole view) says it is the plane"

  - id: air-spacing-true
    title: Aircraft keep real spacing
    words: >
      Aircraft keep their real spacing: no two groups share one point, pairs and fours fly at their real distances
      (fighter pairs about 180-250 m apart), and only a few attackers wait round a bomber box, standing off; a fight
      never looks like one packed swarm.
    from:
      who: Brian
      when: "2026-11-25 14:59Z"
      said: "the fighters are to close to each other ... they are to bunched together"
    tags: [air-battle, air-chase]
    picture: >
      Are aircraft packed together unnaturally: two or more fighters overlapping or almost touching wingtip to wingtip,
      or a tight swarm of ten or more fighters crowded round one bomber group? FAIL if so, saying where. Bombers in a
      box with at least about one wingspan between them, and fighters spread out in pairs, are a PASS.
    owner: air
    weight: high
    known: open

  - id: planes-never-overlap
    title: Aircraft never pass through each other
    words: >
      No two aircraft ever share space or pass through each other, and a formation never looks like one plane that
      splits into several; a collision is at most a rare accident, shown with its result.
    from:
      who: Brian
      when: "2026-11-25 13:39Z"
      said: "the two british fighters clashed into each other and nothing happened"
      also:
        - {who: 3D air thread, when: "2026-11-26 02:40Z", said: "seen: nine Swedish wings drawn inside one another on two points (63 fighters shown as 14 places); they seem to split from one into several"}
    tags: [air-battle, air-chase]
    picture: >
      Do any two aircraft overlap so that one is drawn inside or through the other (wings or bodies merged, two planes
      in one spot)? FAIL saying where. Planes that only look close because one is far behind the other, with a clear
      difference in size, are a PASS.
    owner: air
    weight: high
    known: open
    known_note: "pilot AI R2 open; the stacking fix (part A) is built with row airSteady OFF"

  - id: aircraft-fly-under-power
    title: Aircraft look like they fly forward
    words: >
      Every flying aircraft reads as moving forward under power: its airscrews show a turning disc or blur at every
      range, it banks into its turns, its nose leads its path, something passes it (cloud, ground, flak, trails), and it
      never seems to hang or glide on the spot.
    from:
      who: Brian
      when: "2026-11-25 14:59Z"
      said: "the fighters ... look like their gliding than moving forward"
      also:
        - {who: Brian, when: "2026-11-19 02:57Z", said: "seen (his reference clip): a plane outside not moving naturally, a fault the game must never show"}
        - {who: feel design, when: "2026-11-25", said: "seen: no airscrew turns beyond 300 m; the overview rides along with the bombers so they barely move on screen"}
    tags: [air-battle, air-chase, air-flyover, air-bombs]
    picture: >
      Look at each propeller-driven aircraft near enough to see its propellers. Are the running propellers drawn as a
      spinning disc or blur? FAIL if a flying aircraft's propeller blades are drawn sharp and still, like a parked
      plane's. (A jet, or one engine that is plainly dead and smoking, is not a fault.)
    owner: air
    weight: high
    known: open
    known_note: "fixed only in the fly-past of the preview; feel design steps 1-7 owed"

  - id: dead-engine-smokes
    title: A dead engine smokes
    words: >
      A dead engine stops or windmills and always trails dark smoke, far more than a light haze, from the engine and in
      soot streaks along the tail; running engines keep turning.
    from:
      who: Brian
      when: "2026-11-20 15:29Z"
      said: "seen: he asked that an engine out trail much more dark smoke, from the engine and on the tail"
      also:
        - {who: air realism audit, when: "2026-11-22", said: "seen: dead engines' airscrews keep turning"}
    tags: [air-chase, air-battle]
    picture: >
      Is there an aircraft with a damaged or dead engine (fire, a stopped propeller, a black hole or flames at an
      engine)? If so, does that engine trail a dark stream of smoke at least as long as the plane? FAIL if a damaged
      engine has no smoke or only a faint grey wisp. CAN'T TELL if no damaged engine can be seen.
    owner: effects
    weight: high
    known: open
    known_note: "engine-out soot built in the model files (B17EngineOut), not confirmed in the game; airscrews open"

  - id: fighters-fire-on-attack
    title: Attacking fighters open fire
    words: >
      A fighter making an attack pass fires (muzzle flash and tracer) in its last 1-2 s before it breaks away; no
      fighter flies through or weaves among an enemy formation without firing.
    from:
      who: Brian
      when: "2026-11-25 13:39Z"
      said: "the spitfire in the video keeps weaving in and out of the bombers but doesnt actually shoot"
    tags: [air-chase, air-battle]
    picture: >
      Is there a fighter plainly in an attack pass: close behind or diving at an enemy bomber, nose pointed at it,
      within about five bomber lengths? If so, is it firing (flashes at its guns, or tracer lines from it)? FAIL if it
      is in that pass and shows no fire. CAN'T TELL if no fighter is that close to an enemy.
    owner: air
    weight: high
    known: "off"
    known_note: "pilot AI R2 built with row smartPilots OFF"

  - id: interceptors-approach-in-formation
    title: Interceptors arrive in formation
    words: >
      Interceptors are seen approaching as a formation from their own direction before they break to attack, and they
      and the escort react to each other: fighters choose between the escort and the bombers, never ignoring the
      escort.
    from:
      who: Brian
      when: "2026-11-25 13:39Z"
      said: "when a bombing raid is intercepted I want the enemy fighters to come from a different direction towards them in formation and then break off to attack"
      also:
        - {who: Brian, when: "2026-11-25 13:40Z", said: "i also dont want the intercepting fighters to completely ignore the fighter escort"}
    tags: [air-flyover, air-battle]
    picture: >
      Are fighters seen heading toward the bombers but not yet among them? If so, are they flying together in order
      (pairs, fours or a line, evenly spaced) from one direction? FAIL if the approaching fighters are scattered singly
      in every direction. CAN'T TELL if no approaching fighters are in view.
    owner: air
    weight: high
    known: open
    known_note: "pilot AI R2"

  - id: aircraft-at-b17-standard
    title: Every aircraft is the detailed model
    words: >
      Every aircraft drawn is the newest approved model of its type, at the new B-17's standard: framed glass, panel
      lines, worn paint, real airscrews and markings; never an old low-detail copy.
    from:
      who: Brian
      when: "2026-11-26 03:57Z"
      said: "i want to see what it looks like? can we uplevel all the other aircraft to this bar now too?"
      also:
        - {who: Brian, when: "2026-11-15 03:56Z", said: "seen: he asked for aircraft with the same detail as the tanks"}
        - {who: Brian, when: "2026-11-25 21:14Z", said: "seen: the game still draws the old B-17; the game's copies of seven types are 1.7-6.6x smaller than the workshop's"}
    tags: [air-chase, air-battle]
    picture: >
      Look at the nearest aircraft, if it fills at least about a tenth of the picture's width. Does it show fine
      detail: frames on its glass, panel lines on its skin, worn or chipped paint? FAIL if it is smooth and plain, with
      flat untextured paint and blob-like windows. CAN'T TELL if no aircraft is that close.
    owner: models
    weight: high
    known: "off"
    known_note: "the fine B-17 is built (b17Fine) with its row OFF; the other aircraft open"

  - id: aircraft-glass-and-windows-true
    title: Aircraft glass and windows are right
    words: >
      An aircraft's shape and fittings match its type: a bomber's cockpit is flat framed panes (not a round bubble),
      every window is there, and the B-17's tail gunner sits behind a squarish box of glass, not a round bubble.
    from:
      who: Brian
      when: "2026-11-19 01:19Z"
      said: "seen: the B-17's cockpit was round, windows were missing, and the tail gunner's window was a round bubble instead of a square box"
      also:
        - {who: Brian, when: "2026-11-20 15:29Z", said: "seen: more fittings of the B-17 that did not match its reference"}
        - {who: Brian, when: "2026-11-21 20:31Z", said: "seen: the tail windows still wrong"}
    tags: [air-chase]
    picture: >
      Is a bomber seen close? If so, is its cockpit glass made of flat framed panes, and are its side windows there? On
      a B-17 (four engines, a tall fin) is the tail gunner's glass a squarish box at the very tail? FAIL if the cockpit
      is a smooth round bubble, windows are missing (plain skin where the crew would look out), or the B-17's tail glass
      is a round bubble. CAN'T TELL if no bomber is close.
    owner: models
    weight: high
    known: "off"
    known_note: "fixed in the model files (22 Nov); in the game only with b17Fine, which is OFF"

  - id: aircrew-whole-at-stations
    title: Air crews are whole, at their posts
    words: >
      Every crewman seen through glass or an opening is a whole figure (a head joined to his body by a neck, arms) at
      his own station, wholly inside the aircraft, hands on his gun or sight; one gun and one man to an opening, and no
      head cut off by a turret.
    from:
      who: Brian
      when: "2026-11-19 02:57Z"
      said: "seen (his reference clip): two gunners standing at one window, a fault the game must never show"
      also:
        - {who: Brian, when: "2026-11-19 01:20Z", said: "seen: a gunner's head cut off; it should be inside the turret with both hands on the guns"}
        - {who: Brian, when: "2026-11-21 03:59Z", said: "make sure their necks connect to their heads"}
        - {who: Brian, when: "2026-11-21 18:10Z", said: "the bombadier in the window doesnt have a body"}
    tags: [air-chase]
    picture: >
      Through each window, opening and turret you can see into: does each crewman have a head joined by a neck to a
      body, with arms reaching toward his gun or sight, and is he wholly inside the aircraft? FAIL if a man has no
      body, a floating or cut-off head, sticks out through the skin, or two gunners share one window. CAN'T TELL if no
      crew can be seen.
    owner: models
    weight: high
    known: unknown
    known_note: "bodies, necks and the B-17 crew are mended in the model files; whether the game's copies carry them was not found"

  - id: no-inside-parts-through-skin
    title: Nothing shows through a closed skin
    words: >
      No inside part (bomb load, engine, crew) shows through a closed skin: shut bomb doors, cowlings, hulls and turrets
      are solid.
    from:
      who: 3D pre-check
      when: "2026-11-21 13:15Z"
      said: "seen: the Lancaster's racked bomb load shows through its shut bomb-bay doors"
    tags: [air-chase, air-bombs]
    picture: >
      Can you see anything inside an aircraft through a part that should be solid: bombs showing through closed bomb
      doors, an engine or crew seen through the skin? FAIL saying where. Open bomb doors with bombs in view are a PASS.
    owner: models
    weight: normal
    known: unknown

  - id: losses-look-varied
    title: Aircraft go down in different ways
    words: >
      A battle shows several ways down (fire, a wing off, a spin, a break-up, ditching), no one way for over half the
      losses, and some hit aircraft that do not go down.
    from:
      who: Brian
      when: "2026-11-20 14:23Z"
      said: "seen (after the Pearl Harbor film): every plane hit went down the same way with the same effects; not all planes that get hit should go down"
    tags: [air-battle]
    later: "a fall line per loss in the facts file (how it went down, and hits survived), counted per battle"
    owner: air
    weight: high
    known: fixed
    known_note: "ways down built and passed by the art director (21 Nov 04:00Z): a regression check"

  - id: every-sides-losses-seen
    title: Fighter losses are seen too
    words: >
      Every side's losses are seen: a falling fighter trails fire and smoke as plain as a falling bomber's, and the
      camera shows some falls of every side that loses aircraft.
    from:
      who: Brian
      when: "2026-11-21 05:43Z"
      said: "seen (Bremen demo): he only saw bombers going down; the German fighters are never seen hit and falling with smoke"
    tags: [air-battle, air-chase]
    picture: >
      Is an aircraft falling (nose down, on fire or breaking up)? If it is a fighter (smaller than the bombers, one
      engine), does it trail fire or smoke at least as long as itself, as easy to see as a falling bomber's? FAIL if a
      falling fighter shows no smoke or fire. CAN'T TELL if nothing is falling.
    owner: air
    weight: high
    known: unknown

  - id: tracer-streaks
    title: Tracer is bright streaks
    words: >
      Tracer is short bright streaks along the line of fire from the gun, about one round in five, yellow to orange
      (Brian's ask: yellow, about RGB 213,199,104; a nation palette may vary the hue), core brighter than its glow, at
      least 4 times as long as it is wide; never round dots, pale lamps, cream lines (about 248,243,218) or hollow
      tubes.
    from:
      who: Brian
      when: "2026-11-18 15:00Z"
      said: "seen: he asked for one round in five as yellow streaks"
      also:
        - {who: art director, when: "2026-11-16 15:18Z", said: "seen: map raid tracer drawn as round pale dots that read as stray lamps"}
        - {who: art director, when: "2026-11-20", said: "seen: hollow tubes with a rim darker than the sky; all tracer the old yellow because the nation rows did not reach the game"}
        - {who: art director, when: "2026-11-21 22:50Z", said: "seen: sea battle tracer cream (248,243,218), not yellow (Samar)"}
    tags: [air-chase, air-battle, sea-battle, sea-close, map-raid]
    picture: >
      Are there bullets in flight (tracer)? If so, are they short bright streaks, clearly longer than they are wide,
      yellow to orange, brightest in the middle? FAIL if tracer shows as round dots or blobs, as hollow tubes with a
      darker rim, or as cream or white lines. CAN'T TELL if no tracer can be seen.
    owner: effects
    weight: high
    known: open
    known_note: "map tracer ruled 16 Nov; colours still to check; which colour ruling stands is to be settled"

  - id: clouds-real
    title: Clouds look like real clouds
    words: >
      Clouds have a lit side and a shaded side from one sun, crisp sunlit rims, flatter bases and shadows on the ground
      or sea; never evenly shaded soft cotton balls, rows of one clump size, or a white fog for a sky.
    from:
      who: Brian
      when: "2026-11-20 14:19Z"
      said: "lets make the clouds look more real"
      also:
        - {who: art director, when: "2026-11-20", said: "seen (Pearl Harbor film): flat shading, soft blurry outlines like cotton, a white-fog sky, no cloud shadows on the sea"}
    tags: [air-flyover, air-battle, air-chase, air-bombs, sea-battle]
    picture: >
      Look at the clouds. Do they have a bright sunlit side and a darker shaded side, crisp edges where the sun hits
      them, and flatter bases? FAIL if they are evenly shaded soft blobs like cotton balls, rows of same-size clumps,
      or the whole sky is a flat white fog. CAN'T TELL if no clouds show.
    owner: air
    weight: high
    known: fixed
    known_note: "rounds 15-18, passed 20 Nov 21:39Z: a regression check"

  - id: hit-aircraft-show-damage
    title: Hit aircraft show their damage
    words: >
      A hit aircraft shows its damage where it was hit (rows of bullet holes, flak tears, scorch), never a clean skin
      under its smoke.
    from:
      who: Brian
      when: "2026-11-18 19:33Z"
      said: "if a plane gets hit show the bullet holes or flak holes"
    tags: [air-chase, air-battle]
    picture: >
      Is there an aircraft close enough to see its skin that is plainly hit (smoking, burning, or with a dead engine)?
      If so, does it show holes, tears or scorch on its skin? FAIL if a smoking or burning aircraft's skin is clean and
      whole. CAN'T TELL if no hit aircraft is that close.
    owner: air
    weight: high
    known: unknown
    known_note: "damage layers built for 28 aircraft and handed over; not confirmed in the game"

  - id: aircraft-paint-true-in-light
    title: Aircraft keep their paint colours
    words: >
      An aircraft shows its true upper or lower camouflage from any view and against any background; no bloom or
      cream wash over it, and the sun is kept out of the lens.
    from:
      who: art director
      when: "2026-11-22 05:43Z"
      said: "seen: strike aircraft seen from above over the sea glow cream instead of showing their upper paint; looking up-sun washes camouflage to cream"
    tags: [air-battle, air-chase, air-bombs, sea-battle]
    picture: >
      Look at the aircraft. Can you see their paint colours (greens, greys, browns, blues or bare metal, with their
      markings)? FAIL if an aircraft glows cream, white or pale yellow all over so its camouflage cannot be seen, or a
      sun glare washes it out. CAN'T TELL if no aircraft is near enough to see colour.
    owner: air
    weight: normal
    known: unknown

  - id: air-ground-matches-place
    title: Ground under air battles fits the place
    words: >
      The ground under an air battle matches the real place: inland targets over land, coastal ones on the right
      coast, and the land in its region's colours under a neutral light (never a desert tan over green farm country).
    from:
      who: art director
      when: "2026-11-24 02:17Z"
      said: "seen: inland raids showed sea under the battle (Rhineland in France 1940, Dnepropetrovsk in 1942)"
      also:
        - {who: art director, when: "2026-11-20 23:27Z", said: "seen: the ground under an air battle rendered desert tan (saturation 0.40 against the ground thread's 0.06)"}
    tags: [air-flyover, air-battle, air-bombs]
    picture: >
      The scene's place is given. FAIL if open sea fills the ground under the aircraft while the place named is inland
      (for example the Rhineland, the Ruhr, Berlin or Dnepropetrovsk), or if the land is an even sandy desert tan while
      the place is green farming country (England, northern France, Germany, the Low Countries). CAN'T TELL if the
      ground cannot be seen.
    owner: air
    weight: normal
    known: fixed
    known_note: "sea under inland raids fixed in 1.5 (b413ae12); a neutral key light ruled: regression checks"

  - id: flak-torn-not-balls
    title: Flak looks like torn smoke
    words: >
      A flak burst is hanging smoke: torn, soft and see-through at its edges, dark grey to black, never a solid round
      ball, disc or body; on the map and in 3D raids alike.
    from:
      who: Brian
      when: "2026-11-16 03:15Z"
      said: "dont like how the flak looks ... its solid ... and looks like a ball (he picked 'Hanging smoke' at 03:37Z)"
      also:
        - {who: art director, when: "2026-11-16 13:20Z", said: "seen: map raid flak drawn as 3-5 round soft discs (balls)"}
    tags: [map-raid, air-flyover, air-battle, air-bombs]
    picture: >
      Are there flak bursts (dark puffs in the sky near the aircraft)? If so, are they ragged, torn smoke you can partly
      see through? FAIL if they are solid round balls or discs with smooth edges. CAN'T TELL if no flak can be seen.
    owner: effects
    weight: high
    known: fixed
    known_note: "map flak fixed in round 37 (hanging smoke); 3D raid flak not yet judged"

  - id: flak-in-number-and-hangs
    title: Flak matches the guns and hangs
    words: >
      Flak comes in battery groups (about four bursts together) in number with the guns below (about 9-11 bursts at
      once over heavy guns, 3-4 over light, at the map's playing height), and each burst hangs 25-40 s before it thins
      away.
    from:
      who: art director
      when: "2026-11-16 15:18Z"
      said: "seen: only about 4-5 flak bursts over heavy guns from playing height (the brief says 9-11) and 1-2 over light (brief 3-4)"
      also:
        - {who: feel design, when: "2026-11-25", said: "seen: flak smoke in 3D raids lives only 9 s; over land it is thin and never in batteries of four"}
    tags: [map-raid, air-battle, air-bombs]
    later: "a flak line in the facts file: bursts alive against the target's gun level, each puff's age when it goes, and how they group"
    owner: effects
    weight: normal
    known: open

  - id: aa-guns-shown
    title: Anti-aircraft guns can be seen
    words: >
      Defences the rules hold are visible: every city with anti-aircraft guns shows its gun pits round it on the map,
      and flak and guns on the ground in its raids; guns and flak are never drawn where there are none.
    from:
      who: Brian
      when: "2026-11-24 22:08Z"
      said: "i also don't see any anti aircraft guns around the cities for flak"
    tags: [map-city, air-bombs]
    picture: >
      Can you see anti-aircraft gun positions (small round gun pits or gun stands) round the city or the target? FAIL if
      this is a near view of a capital or big city, or of a raid's target city, and none can be seen anywhere round it.
      CAN'T TELL if the view is too far away to see small gun pits, or no city is in view.
    owner: map
    weight: high
    known: open
    known_note: "start-of-war guns ON in 1.5.1; guns on the ground in the 3D raid scene open (R2 flak brief)"

  - id: air-nothing-pops
    title: No aircraft pops in or out
    words: >
      No aircraft, cloud or effect appears or vanishes in sight in one frame, and no model visibly swaps its shape,
      shadow or brightness between frames; new aircraft come in from off screen or fade in, and losses leave by
      falling.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: aircraft made and unmade in clear air, often within 100 m of another (79 within 300 m at Bremen)"
      also:
        - {who: 3D air thread, when: "2026-11-26 02:40Z", said: "seen: replacement fighters pop in (3 Swedes on screen); near, far and light shapes swap at 434 m (462 swaps a battle) and may flicker"}
    tags: [air-flyover, air-battle, air-chase, air-bombs]
    clip:
      - {measure: pop, max: 0}
    owner: air
    weight: normal
    known: open
    known_note: "the shape swaps are not yet seen on the Mac"

  - id: no-stand-in-aircraft
    title: Every nation flies its own types
    words: >
      Every nation's aircraft are drawn as their own types; a generic stand-in model (a 'Fighter:' or 'Bomber:' shape)
      never appears in a battle.
    from:
      who: 3D air thread
      when: "2026-11-25 21:28Z"
      said: "seen: Sweden is always one generic stand-in 'Fighter:SWE'; its type mix never reaches the 3D"
      also:
        - {who: air realism audit, when: "2026-11-22 04:42Z", said: "seen: at Midway the Wildcat and Devastator had no model and were drawn as a generic fighter and bomber"}
    tags: [air-battle, air-chase]
    later: "a check over the marks lines' type (or a model line per group) that fails on a stand-in type name"
    owner: models
    weight: normal
    known: open
    known_note: "the fighters need new models first"

  - id: weapons-released-at-true-height
    title: Torpedoes drop from wave-top height
    words: >
      Weapons are released from their real height: torpedoes from 10-25 m over the waves, dive bombers at the bottom
      of their dive, level bombers from their bombing height.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: torpedo planes dropped their torpedoes from about 4.2-4.5 km up instead of from wave-top height (Pearl Harbor, Midway)"
    tags: [air-bombs]
    picture: >
      Is a torpedo being dropped, or just dropped, from an aircraft? If so, is that aircraft just above the waves (lower
      than about two of its own wingspans)? FAIL if it is high above the sea with the ships small far below. CAN'T TELL
      if no torpedo drop is shown.
    owner: air
    weight: normal
    known: unknown

  - id: heavy-bombers-bank-gently
    title: Heavy bombers bank gently
    words: >
      Heavy bombers bank at most about 20 degrees, and after bombing a box turns for home as one body; they never bank
      like fighters or scatter over kilometres.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: heavy bombers banked 60 degrees like fighters, and after bombing the box fell apart (13 by 9 km)"
    tags: [air-battle, air-bombs, air-chase]
    picture: >
      Is any four-engine bomber that is still flying under control banked steeply, its wings tilted more than about 20
      degrees from level (a quarter of the way to upright is about 22)? FAIL saying which. A bomber falling out of
      control does not count.
    owner: air
    weight: normal
    known: open
    known_note: "the bomb run is steadied; the box's turn for home open"

  - id: contrails-on-high-raids
    title: High raids leave vapour trails
    words: >
      High raids (about 7,200 m and up) draw white condensation trails behind the aircraft where the weather allows,
      and raids fly at their true height.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: no vapour trails are drawn (computed but never drawn); Bremen flies at about half its true height"
    tags: [air-battle, air-flyover]
    later: "the aircraft's height in the planes lines and a trails-drawn line (a still cannot tell the height)"
    owner: effects
    weight: normal
    known: open

  - id: falls-turn-at-followable-rate
    title: Falling aircraft spin believably
    words: >
      A falling aircraft eases into its fall and turns at a rate the eye can follow (a fighter spins about 120-180
      degrees a second, a heavy bomber 36-72), never snapping or spinning into a blur.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: falling aircraft spin and roll 2-7x too fast (fighter median 360 degrees a second) and snap into the fall"
    tags: [air-battle]
    later: "each falling aircraft's spin and roll rate in the facts file (the planes lines carry no attitude)"
    owner: air
    weight: normal
    known: unknown

  - id: types-fly-own-speeds
    title: Each aircraft type flies its own way
    words: >
      Each aircraft type flies at its own speeds and turns, and climbing costs speed; a battle never has every fighter
      at one speed and every bomber at another.
    from:
      who: air realism audit
      when: "2026-11-22 04:42Z"
      said: "seen: every fighter flies at 120 m/s and every bomber at 85 m/s; climbing costs nothing"
    tags: [air-battle]
    later: "speed and turn per aircraft type in the facts file, with a spread check"
    owner: air
    weight: normal
    known: open

  - id: aircraft-first-seen-flying
    title: Aircraft never hang still in the air
    words: >
      Every aircraft is first seen already flying, taking off or climbing; no aircraft stands still in the air, turns
      about in one frame, or drops hundreds of metres between two views.
    from:
      who: 3D air thread
      when: "2026-11-25 21:28Z"
      said: "seen: a late-scrambled wing appears about 117 s after its scramble standing still on the target point at raid height, spins and lurches off"
    tags: [air-battle]
    later: "per group speed, heading and height per frame in the facts file (speed 0 while airborne, a heading change over 90 degrees or a height jump over 500 m between views)"
    owner: air
    weight: normal
    known: open

  - id: nose-art-on-us-bombers
    title: American bombers carry nose art
    words: >
      Approved art reaches the game: American bombers show nose art from the painted set (about one in five bare),
      never two alike in one group; other nations' bombers carry none.
    from:
      who: 3D air thread
      when: "2026-11-25 01:10Z"
      said: "seen: 200 nose arts were painted and passed but none is in the game"
      also:
        - {who: Brian, when: "2026-11-20 15:27Z", said: "seen: he asked for nose art; on 25 Nov 01:30Z: american only"}
    tags: [air-chase]
    picture: >
      Are there American bombers (white star marking) close enough to see their noses? If three or more such noses can
      be seen, does at least one carry a painted picture or name? FAIL if three or more visible American bomber noses
      are all bare, or two side by side carry the same painting. CAN'T TELL if fewer than three such noses can be seen.
    owner: air
    weight: normal
    known: open
    known_note: "R2 wiring behind a switch"

  - id: battle-end-agrees
    title: The end agrees with the result
    words: >
      Everything a battle shows at its end (the bar, the music, the words) agrees with the booked result on the after
      card.
    from:
      who: playtester
      when: "2026-11-23 17:00Z"
      said: "seen: the end bar and the music disagreed with the after card in 34 of 55 hand-overs to the staff, and in some unopposed fights"
    tags: [air-after-card, land-after-card, sea-after-card]
    picture: >
      Does everything on this end card name the same result (the same winner, or the same draw, in its heading, its bar
      and its words)? FAIL if one part names one side as the winner and another part names the other. CAN'T TELL if the
      card does not say who won.
    owner: ui
    weight: normal
    known: fixed
    known_note: "fixed in 1.5 (72bcc46c): a regression check"

  # ---------------------------------------------------------------- ships, fleets and sea battles

  - id: wake-trails-behind
    title: Wakes trail behind ships
    words: >
      A ship's wake always trails behind her along the way she actually sailed (within about 25 degrees of the back of
      her track): never toward the same side of the screen by habit, never ahead of the bow or off her side, and it
      never swings round when the camera turns. Only fleets seen to sail or arrive in the run can be judged: a fleet
      only ever seen at rest has no known heading (headings are not saved on a new game or a load), and a fleet in
      harbour faces the table on purpose and shows no wake in port, which is not a fault.
    from:
      who: Brian
      when: "2026-11-26 03:50Z"
      said: "the wake of the boats when moving don't follow the direction they came from (his screenshot of the North Sea '45 ships' fleet)"
      also:
        - {who: art director, when: "2026-11-26 05:18Z", said: "pass line: the wake at rest within 25 degrees of the back of her track (a short sail with a late corner can be about 20 degrees off); judge only fleets seen to sail or arrive"}
    tags: [map-fleet-sailing, map-fleet-rest, sea-battle, sea-close]
    picture: >
      Judge only ships or fleets that the shot's description says sailed or arrived in this run, or that are plainly
      under way in it; for any other fleet answer CAN'T TELL. For each of those with white foam or a pale trail on the
      water: is the trail behind her stern, opposite her bow, and in line with her within about 25 degrees? FAIL if a
      trail leaves from the bow or the side, or if three or more such fleets facing different ways all trail to the same
      side of the screen. A fleet in harbour with no trail is not a fault.
    facts: fleet-bow-on-course
    owner: navy
    weight: high
    known: "off"
    known_note: "fix tc.Map.FleetHeading built (Play top-up 93a117038), row fleetheading OFF until the Mac check (row P42) passes: flagged every night until then"

  - id: wakes-widen-and-fade
    title: Wakes widen and fade astern
    words: >
      A wake is sized to its ship and grows with her speed; it widens, breaks up and fades astern in two tones (bright
      at the stern, greyer behind), never a flat white ribbon or a ruled stripe of even width. A ship in harbour,
      stopped or sinking shows no passage wake, and a wake never runs across another ship's hull.
    from:
      who: Brian
      when: "2026-11-15 03:57Z"
      said: "seen: the map's ship wake looked like white paint: it did not widen, it was one tone, and the bow wave was a ruled dotted line"
      also:
        - {who: art director, when: "2026-11-21 22:50Z", said: "seen: sea battle wakes are crisp lines of constant width and, close up, flat white ribbons"}
        - {who: art director, when: "2026-11-25", said: "seen (map): a wake ribbon runs under another fleet's hulls; no passage wake when a fleet comes into harbour"}
    tags: [map-fleet-sailing, map-fleet-rest, sea-battle, sea-close]
    picture: >
      Look at each wake behind a moving ship. Does it widen and fade with distance behind the stern, breaking into foam?
      FAIL if a wake is a flat white stripe of even width and brightness, a ruled dotted line, or runs over another
      ship's hull; also FAIL if a ship tied up in harbour trails a long wake. CAN'T TELL if no wake can be seen.
    owner: navy
    weight: high
    known: open
    known_note: "map wake accepted (22e868e); the harbour passage wake open; the sea battle wake passed its own checks, Mac re-shoot owed"

  - id: ships-detailed
    title: Ships are as detailed as tanks
    words: >
      Ships carry tank-level detail: plating, fittings, weathering as streaks running down from fittings (never even
      stripes, and light wear never reads as rust), hit marks where hit; they ride and heel in the sea.
    from:
      who: Brian
      when: "2026-11-25 12:53Z"
      said: "the ships to be more detailed like the tanks? I want to keep upleveling the graphics and smoothness of how they move and act"
      also:
        - {who: art director, when: "2026-11-25 20:28Z", said: "seen: the U-boat's weathering still read as stripes, and light wear read as rust"}
    tags: [sea-close]
    picture: >
      Look at the nearest ship, if it fills at least about a quarter of the picture's width. Does its hull show plating
      lines, deck fittings, and weathering that runs down in streaks from the fittings? FAIL if the hull is plain and
      smooth like a toy, the weathering is even stripes, or light wear shows as rust-orange all over. CAN'T TELL if no
      ship is that close.
    owner: navy
    weight: high
    known: "off"
    known_note: "R2 in progress behind switches that are OFF"

  - id: hulls-never-overlap
    title: Ships never sail through each other
    words: >
      No two hulls ever overlap or pass over each other; ships give way and slow down.
    from:
      who: Brian
      when: "2026-11-22 05:31Z"
      said: "ships are turning into each other and going over each other"
    tags: [sea-battle, sea-close]
    picture: >
      Do any two ships overlap, one hull drawn into or over another? FAIL saying where. Ships close together with water
